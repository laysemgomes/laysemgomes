<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Layse Gomes</title>
  <desc id="d">Desenvolvedora. Software, saúde digital e inteligência artificial. Código que cuida de quem usa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1538"/>
      <stop offset="0.55" stop-color="#22173A"/>
      <stop offset="1" stop-color="#16132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4A7C4"/>
      <stop offset="1" stop-color="#B49CF5"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B0814" flood-opacity="0.55"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 17px; }
    .kw { fill: #F4A7C4; }
    .key { fill: #C9B8FF; }
    .str { fill: #9FE3C9; }
    .pun { fill: #A79FB8; }
    .bool { fill: #FFD49A; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
    .s2 { animation-delay: 1.1s; }
    .s3 { animation-delay: 2.1s; }
    .blob1 { animation: drift 14s ease-in-out infinite alternate; }
    .blob2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.75); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-40px, 24px); } }
  </style>

  <g clip-path="url(#card)">
    <!-- fundo -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="blob1" cx="1010" cy="70" r="150" fill="#B49CF5" fill-opacity="0.45"/>
      <circle class="blob2" cx="760" cy="330" r="140" fill="#F4A7C4" fill-opacity="0.35"/>
      <circle cx="120" cy="20" r="110" fill="#F4A7C4" fill-opacity="0.18"/>
    </g>
    <rect width="1200" height="340" fill="url(#dots)"/>

    <!-- lado esquerdo -->
    <g class="sans">
      <rect x="64" y="66" width="190" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <circle cx="84" cy="81" r="4.5" fill="#9FE3C9"/>
      <text x="97" y="86" font-size="14" font-weight="600" fill="#E9E3F5">Recife, PE · CIn/UFPE</text>

      <text x="62" y="170" font-size="66" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Layse Gomes</text>
      <rect x="64" y="190" width="56" height="4" rx="2" fill="url(#accent)"/>
      <text x="64" y="232" font-size="20" font-weight="600" fill="url(#accent)">Desenvolvedora · Saúde digital · IA</text>
      <text x="64" y="266" font-size="18" fill="#CFC7DF">Código que cuida de quem usa.</text>
    </g>

    <!-- janela de código -->
    <g transform="translate(660 58)" filter="url(#shadow)">
      <rect width="480" height="228" rx="14" fill="#15111F" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <path d="M0 14 a14 14 0 0 1 14 -14 h452 a14 14 0 0 1 14 14 v24 h-480 z" fill="#FFFFFF" fill-opacity="0.04"/>
      <circle cx="22" cy="19" r="5.5" fill="#F4A7C4"/>
      <circle cx="40" cy="19" r="5.5" fill="#FFD49A"/>
      <circle cx="58" cy="19" r="5.5" fill="#9FE3C9"/>
      <text x="240" y="24" text-anchor="middle" class="sans" font-size="12.5" fill="#8E86A3">layse.ts</text>

      <g class="mono">
        <text x="24" y="70"><tspan class="kw">const</tspan><tspan fill="#FFFFFF"> layse </tspan><tspan class="pun">= {</tspan></text>
        <text x="58" y="98"><tspan class="key">estuda</tspan><tspan class="pun">: </tspan><tspan class="str">"Sistemas de Informação"</tspan><tspan class="pun">,</tspan></text>
        <text x="58" y="126"><tspan class="key">constroi</tspan><tspan class="pun">: [</tspan><tspan class="str">"gestão"</tspan><tspan class="pun">, </tspan><tspan class="str">"saúde"</tspan><tspan class="pun">, </tspan><tspan class="str">"IA"</tspan><tspan class="pun">],</tspan></text>
        <text x="58" y="154"><tspan class="key">cuida</tspan><tspan class="pun">: [</tspan><tspan class="str">"testes"</tspan><tspan class="pun">, </tspan><tspan class="str">"segurança"</tspan><tspan class="pun">],</tspan></text>
        <text x="58" y="182"><tspan class="key">emProducao</tspan><tspan class="pun">: </tspan><tspan class="bool">true</tspan><tspan class="pun">,</tspan></text>
        <text x="24" y="210"><tspan class="pun">};</tspan></text>
      </g>
      <rect class="cursor" x="48" y="196" width="9" height="19" rx="1" fill="#F4A7C4"/>
    </g>

    <!-- brilhos -->
    <path class="spark" d="M1150 40 l3.5 9 l9 3.5 l-9 3.5 l-3.5 9 l-3.5 -9 l-9 -3.5 l9 -3.5 z" fill="#F4A7C4"/>
    <path class="spark s2" d="M610 70 l2.5 6.5 l6.5 2.5 l-6.5 2.5 l-2.5 6.5 l-2.5 -6.5 l-6.5 -2.5 l6.5 -2.5 z" fill="#C9B8FF"/>
    <path class="spark s3" d="M1120 306 l3 7.5 l7.5 3 l-7.5 3 l-3 7.5 l-3 -7.5 l-7.5 -3 l7.5 -3 z" fill="#9FE3C9"/>
  </g>
</svg>
